name: Web U-Boot 页面用例

# 救砖页是这个项目里用户唯一直接接触的东西，也是唯一编译检查不到的东西 ——
# 它是一大段 JS，被 gen.py 转成 C 字符串塞进 net/httpd.c，编译器只看见字符串。
#
# 所以页面靠 files/httpd/test/ 里的 jsdom 用例守着：preview.py 渲出设备真正
# 会发的那份 HTML（后面挂一个应答全部端点的桩），用例驱动那个文档。跑的是真
# 页面源文件，不是复制品。
#
# 只在 httpd 目录有改动时触发 —— 页面之外的提交没必要为它排队。

on:
  push:
    paths:
      - 'package/boot/uboot-airoha/files/httpd/**'
      - '.github/workflows/httpd-page-test.yml'
  pull_request:
    paths:
      - 'package/boot/uboot-airoha/files/httpd/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: httpd-page-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: package/boot/uboot-airoha/files/httpd/test

    steps:
      - name: Checkout(检出)
        uses: actions/checkout@v4

      - name: Setup Node(装 Node)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install jsdom(装依赖)
        run: npm install --no-audit --no-fund

      # 用例自己会先跑 preview.py 渲染，所以这里不用单独一步；
      # runner 自带 python3。
      - name: Run page cases(跑用例)
        run: npm test
